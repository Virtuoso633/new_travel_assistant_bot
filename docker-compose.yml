# -------------------------
# docker-compose.yml (Corrected for Production)
# -------------------------
version: "3.9"

services:
  rasa-server:
    build:
      context: ./rasa
      dockerfile: Dockerfile.rasa
    container_name: rasa-server
    command: >
      python -m rasa run --enable-api --cors "*" --port 5005
      --endpoints /app/endpoints.yml
      --model /app/models/model.tar.gz
    ports:
      - "5005:5005"
    volumes:
      - ./rasa:/app
    depends_on:
      - action-server
    networks:
      - rasa-network

  action-server:
    build:
      context: ./rasa
      dockerfile: Dockerfile.actions
    container_name: action-server
    command: >
      python -m rasa run actions --actions actions --port 5055
    ports:
      - "5055:5055"
    volumes:
      - ./rasa/actions:/app/actions
      - ./rasa/requirements.txt:/app/requirements.txt
    networks:
      - rasa-network

  travel-frontend:
    build:
      context: ./rasa/frontend
      dockerfile: Dockerfile.frontend
    container_name: travel-frontend
    ports:
      - "80:80"
    networks:
      - rasa-network

networks:
  rasa-network:
    driver: bridge
