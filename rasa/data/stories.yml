# -------------------------
# stories.yml (Harmonized Version)
# -------------------------
version: "3.1"

stories:
- story: User asks for weather directly with a city
  steps:
  - intent: ask_weather
    entities:
    - location: "New Delhi"
  - slot_was_set:
    - destination_city: "New Delhi"
  - action: action_get_weather

- story: User asks for packing directly with a city
  steps:
  - intent: recommend_packing
    entities:
    - location: "Mumbai"
  - slot_was_set:
    - destination_city: "Mumbai"
  - action: action_recommend_packing

- story: User asks for weather, then packing for the same city
  steps:
  - intent: ask_weather
    entities:
    - location: "London"
  - slot_was_set:
    - destination_city: "London"
  - action: action_get_weather
  - intent: recommend_packing
  - action: action_recommend_packing

# FIXED: Removed the problematic story that conflicts with the rule
# We'll handle the packing → weather flow in the action.py code instead

- story: User asks for weather, then checks another city
  steps:
  - intent: ask_weather
    entities:
    - location: "Tokyo"
  - slot_was_set:
    - destination_city: "Tokyo" 
  - action: action_get_weather
  - intent: change_city
  - action: action_ask_for_new_city
  - slot_was_set:
    - destination_city: null
  - intent: inform
    entities:
    - location: "Sydney"
  - slot_was_set:
    - destination_city: "Sydney"
  - action: action_get_weather

- story: User asks for weather without providing a city
  steps:
  - intent: ask_weather
  - action: action_get_weather
  - slot_was_set:
    - destination_city: null
  - intent: inform
    entities:
    - location: "Dubai" 
  - slot_was_set:
    - destination_city: "Dubai"
  - action: action_get_weather

- story: User asks for packing without providing a city
  steps:
  - intent: recommend_packing
  - action: action_recommend_packing
  - slot_was_set:
    - destination_city: null
  - intent: inform
    entities:
    - location: "Amsterdam"
  - slot_was_set:
    - destination_city: "Amsterdam"
  - action: action_recommend_packing

- story: User just provides a city name without context
  steps:
  - slot_was_set:
    - destination_city: null
  - intent: inform
    entities:
    - location: "Barcelona"
  - slot_was_set:
    - destination_city: "Barcelona"
  - action: action_clarify_city_usage
  - intent: ask_weather
  - action: action_get_weather

- story: User starts travel planning with form
  steps:
  - intent: start_travel_planning
  - action: travel_info_form
  - active_loop: travel_info_form
  - slot_was_set:
    - requested_slot: null
  - active_loop: null
  - action: utter_submit
  - action: action_get_weather
  - action: action_recommend_packing

# FIXED: Removed the "Using affirm and deny" story that was causing conflicts