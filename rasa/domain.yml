version: "3.1"

intents:
  - greet
  - goodbye
  - ask_weather
  - recommend_packing
  - start_travel_planning  # Added missing intent
  - inform
  - change_city
  - out_of_scope
  - affirm
  - deny
  - faq_what_is_rasa
  - faq_who_built_you

entities:
  - location

slots:
  destination_city:
    type: text
    mappings:
    - type: from_entity
      entity: location
  weather_info:
    type: text
    mappings:
    - type: custom
  start_date:  # Added missing slot
    type: text
    mappings:
    - type: from_text
      conditions:
      - active_loop: travel_info_form
        requested_slot: start_date
  end_date:  # Added missing slot
    type: text
    mappings:
    - type: from_text
      conditions:
      - active_loop: travel_info_form
        requested_slot: end_date
  requested_slot:  # Required for forms
    type: text
    influence_conversation: false
    mappings:
    - type: custom

forms:
  travel_info_form:  # Added missing form
    required_slots:
      - destination_city
      - start_date
      - end_date

responses:
  utter_greet:
    - text: "👋 Hello! I'm your travel assistant. I can help with weather forecasts and packing suggestions. What city are you planning to visit?"

  utter_goodbye:
    - text: "👋 Goodbye! Have a great trip!"
  
  utter_submit:  # Added missing response
    - text: "Thanks for providing your travel information! I'll help you prepare for your trip to {destination_city}."
  
  utter_after_weather:
    - text: "Would you like packing suggestions for {destination_city} based on the weather?"
  
  utter_after_packing:
    - text: "Is there anything else you'd like to know about {destination_city}?"
  
  utter_ask_destination_city:
    - text: "Which city are you planning to visit?"
  
  utter_clarify_city_usage:
    - text: "I see you're interested in {destination_city}. Would you like to know about the weather or get packing suggestions?"
  
  utter_out_of_scope:
    - text: "Sorry, I'm focused on helping with travel weather and packing. I can't help with that request."
  
  utter_faq_what_is_rasa:
    - text: "Rasa is an open source framework that powers this conversational AI assistant."
  
  utter_faq_who_built_you:
    - text: "I was built by a developer for the Yoliday Internship Assessment to demonstrate travel assistant capabilities."
  utter_default:
    - text: "I'm not sure how to help with that. You can ask me about the weather or packing suggestions for a specific city."

actions:
  - action_get_weather
  - action_recommend_packing
  - action_ask_for_new_city
  - action_clarify_city_usage  # Added missing action
  - action_reset_slots_and_ask
  - validate_travel_info_form

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true