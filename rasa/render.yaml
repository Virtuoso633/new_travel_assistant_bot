# -------------------------
# render.yml (Verified)
# -------------------------
services:
  # Rasa Action Server (Private Service)
  - type: pvt
    name: action-server
    env: docker
    dockerfilePath: ./Dockerfile.actions
    dockerContext: .
    plan: free

  # Rasa Server (Public Web Service)
  - type: web
    name: rasa-server
    env: docker
    dockerfilePath: ./Dockerfile.rasa
    dockerContext: .
    plan: free
    healthCheck:
      path: /
    envVars:
      - key: ACTION_SERVER_URL
        fromService:
          type: pvt
          name: action-server
          property: url
      - key: RASA_TELEMETRY_ENABLED
        value: false
    # This command runs the Rasa server and connects to the action server.
    # The port is automatically set by Render via the $PORT environment variable.
    startCommand: "rasa run --enable-api --cors \"*\" -p $PORT --endpoints endpoints.yml"

  # Frontend (React App as a Static Site)
  - type: static
    name: frontend
    rootDir: ./frontend # Assuming frontend is at the root level alongside the rasa folder
    buildCommand: "npm install && npm run build"
    publishDir: "./build"
    envVars:
      # Passes the Rasa server URL to the React app at build time.
      - key: REACT_APP_RASA_SERVER_URL
        fromService:
          type: web
          name: rasa-server
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html