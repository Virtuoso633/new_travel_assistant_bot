# -------------------------------
# rasa/frontend/nginx.conf (New File)
# -------------------------------
server {
  # Listen on port 80 for incoming connections
  listen 80;

  # Set the root directory where the static files are located
  root /usr/share/nginx/html;

  # This is the crucial part for a Single Page Application (SPA).
  # It tells Nginx to try serving the requested file, then a directory,
  # and if both fail, it will fall back to serving /index.html.
  # This allows React Router to handle all the page navigation.
  location / {
    try_files $uri $uri/ /index.html;
  }
}